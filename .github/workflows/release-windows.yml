name: Release Windows (Tessitura)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to build (e.g. 1.0.0 or 1.1.0-beta.1)"
        required: true
        default: "1.0.0"
      trust_policy:
        description: "Installer trust policy embedded in build_config.json"
        required: false
        default: "strict"
        type: choice
        options:
          - strict
          - checksum_only

permissions:
  contents: read

jobs:
  verify:
    name: Automated Test Suite & Quality Gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit and integration test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

  build-windows:
    name: Build Tessitura.exe & Windows Installer
    needs: verify
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build dependencies (PyInstaller & runtime requirements)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Ensure Inno Setup 6 is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }

      - name: Resolve and validate SemVer metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ inputs.version }}"
          } else {
            $rawTag = "${{ github.ref_name }}"
          }
          $ver = (python -c "import sys; from src.version import SemVer; v = SemVer.parse(sys.argv[1]); print(v.version_without_build)" "$rawTag").Trim()
          $isPre = (python -c "import sys; from src.version import SemVer; v = SemVer.parse(sys.argv[1]); print('true' if v.is_prerelease else 'false')" "$rawTag").Trim()
          $chan = if ($isPre -eq "true") { "beta" } else { "stable" }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "is_prerelease=$isPre" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "channel=$chan" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Import Authenticode certificate (if configured)
        id: cert
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "tessitura-sign.pfx"
            [System.IO.File]::WriteAllBytes($pfxPath, [System.Convert]::FromBase64String($env:CERT_BASE64))
            $secPass = ConvertTo-SecureString -String $env:CERT_PASS -AsPlainText -Force
            $imported = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $secPass
            "thumbprint=$($imported.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "thumbprint=" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Build Tessitura.exe, Tessitura-Setup-{version}.exe, and SHA256SUMS.txt
        shell: pwsh
        run: |
          $owner, $repo = "${{ github.repository }}" -split "/"
          $policy = if ("${{ inputs.trust_policy }}" -ne "") { "${{ inputs.trust_policy }}" } else { "strict" }
          .\scripts\build-windows.ps1 `
            -Version "${{ steps.meta.outputs.version }}" `
            -Channel "${{ steps.meta.outputs.channel }}" `
            -GitHubOwner $owner `
            -GitHubRepo $repo `
            -TrustPolicy $policy `
            -SignCertThumbprint "${{ steps.cert.outputs.thumbprint }}" `
            -SkipTests

      - name: Smoke-test silent installation and uninstallation
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $setupExe = Resolve-Path "dist\Tessitura-Setup-$ver.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "TessituraInstallSmoke"
          $proc = Start-Process -FilePath $setupExe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=`"$installRoot`"" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Silent install exited with code $($proc.ExitCode)"
          }
          $installedExe = Join-Path $installRoot "Tessitura.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed Tessitura.exe not found at $installedExe"
          }
          $smokeJson = Join-Path $env:RUNNER_TEMP "installed_smoke.json"
          $env:TESSITURA_SMOKE_OUT = $smokeJson
          $runProc = Start-Process -FilePath $installedExe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($runProc.ExitCode -ne 0 -or -not (Test-Path $smokeJson)) {
            throw "Installed Tessitura.exe failed --smoke-test"
          }
          $uninsExe = Join-Path $installRoot "unins000.exe"
          if (Test-Path $uninsExe) {
            $uProc = Start-Process -FilePath $uninsExe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
            if ($uProc.ExitCode -ne 0) {
              throw "Silent uninstall exited with code $($uProc.ExitCode)"
            }
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: tessitura-windows-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: |
            dist/Tessitura-Setup-${{ steps.meta.outputs.version }}.exe
            dist/SHA256SUMS.txt

  publish-release:
    name: Publish GitHub Release
    needs:
      - verify
      - build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: tessitura-windows-${{ needs.build-windows.outputs.version }}
          path: release-assets

      - name: Verify SHA256SUMS.txt before publishing
        working-directory: release-assets
        run: |
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub Release via gh CLI
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          IS_PRERELEASE: ${{ needs.build-windows.outputs.is_prerelease }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PRE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRE_FLAG="--prerelease"
          else
            PRE_FLAG="--latest"
          fi
          gh release create "$TAG_NAME" \
            "Tessitura-Setup-${VERSION}.exe" \
            "SHA256SUMS.txt" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Tessitura ${VERSION}" \
            --generate-notes \
            $PRE_FLAG

